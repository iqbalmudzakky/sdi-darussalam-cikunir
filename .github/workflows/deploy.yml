name: Deploy

# Satu alur per push: bangun image, lalu deploy. staging → staging, main →
# production. Yang menentukan kapan sekolah menerima versi baru tetap manusia,
# lewat merge ke main. Image diberi tag "staging"/"main" dan sha-<commit>; yang
# di-deploy selalu sha-<commit>, jadi pasti hasil build commit itu. Migrasi
# database dijalankan pmb-deploy di server sebelum container diganti.
#
# Jalankan dengan tangan untuk rollback ke tag tertentu — tahap build dilewati.
#
# Kunci deploy di server dikunci ke satu perintah (/usr/local/bin/pmb-deploy,
# lihat ops/pmb-deploy.sh). Jadi workflow ini tidak menjalankan docker apa pun
# di server — ia hanya menyebutkan lingkungan dan tag. Kalau secret di sini
# bocor, yang bisa dilakukan orang lain sebatas men-deploy ulang PMB.
on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: Lingkungan yang di-deploy
        required: true
        type: choice
        options: [staging, production]
        default: staging
      tag:
        description: Tag image, mis. sha-1a2b3c4 (kosongkan untuk "staging"/"main" sesuai lingkungan)
        required: false
        type: string
      update_compose:
        description: Kirim ulang compose.yml dari repo sebelum deploy
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          # Konteks DIREKTORI, bukan tar lewat stdin — kalau tar, .dockerignore
          # diabaikan seluruhnya dan berkas rahasia ikut masuk image.
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Saat dijalankan dengan tangan, build dilewati (skipped) — deploy tetap jalan.
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Dua deploy bersamaan bisa saling menimpa container yang sedang dibuat ulang.
    concurrency:
      group: deploy-${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Tentukan lingkungan & tag
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            [ "$GITHUB_REF_NAME" = "main" ] && environment=production || environment=staging
            tag="sha-${GITHUB_SHA::7}"
          else
            environment="$INPUT_ENVIRONMENT"
            tag="$INPUT_TAG"
          fi
          echo "DEPLOY_ENVIRONMENT=$environment" >> "$GITHUB_ENV"
          echo "DEPLOY_TAG=$tag" >> "$GITHUB_ENV"
          echo "Deploy $environment, tag: ${tag:-bawaan}"

      - name: Siapkan kunci SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Host key dipin lewat secret — bukan StrictHostKeyChecking=no, yang
          # membuat deploy menerima server mana pun yang menjawab.
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Kirim compose.yml
        if: github.event_name == 'push' || inputs.update_compose
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" put-compose < compose.yml

      - name: Deploy
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "deploy $DEPLOY_ENVIRONMENT $DEPLOY_TAG"
